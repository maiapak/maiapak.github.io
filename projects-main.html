<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'%3E%3Crect width='50' height='50' fill='%23FD6269'/%3E%3C/svg%3E">
<style>
  :root{
    --unit: 12px;
    --green: #DCE05A;
    --coral: #FD6269;
    --ink: #111111;
    --muted: #8a8a86;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: var(--ink);
    font-family: 'Times New Roman', Times, serif;
    -webkit-font-smoothing: antialiased;
  }

  .swatch {
    position: fixed;
    top: var(--unit);
    left: var(--unit);
    width: 38px;
    height: 38px;
    background: var(--coral);
    z-index: 100;
  }

  .top-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: flex-end;
    gap: 18px;
    padding: 14px var(--unit) 22px;
    font-size: 14px;
    line-height: 1.15;
    z-index: 50;
    background: transparent;
  }

  .top-nav a {
    color: #000000;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .top-nav a:hover { color: var(--green); }

  .list {
    padding: 250px var(--unit) 0;
  }

  .project-tile {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: var(--ink);
  }

  .project-tile + .project-tile {
    margin-top: 160px;
  }

  .project-tile .image {
    width: 48%;
    flex-shrink: 0;
    aspect-ratio: 1430 / 802;
    background: #E7E6E2;
    background-image:
      linear-gradient(45deg, #d3d2cd 25%, transparent 25%),
      linear-gradient(-45deg, #d3d2cd 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #d3d2cd 75%),
      linear-gradient(-45deg, transparent 75%, #d3d2cd 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    overflow: hidden;
  }

  .project-tile .image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }

  .project-tile:hover .image img { transform: scale(1.06); }

  /* show the whole image (no cropping), with room for the hover zoom */
  .project-tile .image.fit {
    background: #ffffff;
    padding: 3%;
  }

  .project-tile .image.fit img { object-fit: contain; }

  /* no visible frame to crop against, so zoom a bit more to make it noticeable */
  .project-tile:hover .image.fit img { transform: scale(1.1); }

  .project-tile .caption {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    font-family: 'Times New Roman', Times, serif;
  }

  .project-tile .title {
    font-size: 14px;
    font-weight: 400;
    line-height: 1.15;
  }


  .footer {
    background: var(--green);
    padding: 90px var(--unit);
    font-size: 14px;
    line-height: 1.15;
    margin-top: 190px;
  }

  .footer-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-left .loc { font-weight: 500; }
  .footer-left .time { color: #333; }

  .footer-right { display: flex; gap: 32px; }
  .footer-col { display: flex; flex-direction: column; gap: 6px; }
  .footer-col a { color: var(--ink); text-decoration: none; }
  .footer-col a:hover { text-decoration: underline; }

  @media (max-width: 760px) {
    .footer-inner { flex-direction: column; gap: 24px; }
  }

  .nav-dropdown {
    position: relative;
  }

  .nav-dropdown > a {
    cursor: pointer;
  }

  .nav-dropdown .dropdown-menu {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 0;
    padding-top: 10px;
    background: transparent;
    display: none;
    flex-direction: column;
    gap: 6px;
    min-width: 100%;
    z-index: 60;
  }

  .nav-dropdown .dropdown-menu a {
    padding: 2px 0;
  }

  .nav-dropdown:hover .dropdown-menu,
  .nav-dropdown.open .dropdown-menu {
    display: flex;
  }

  .dropdown-menu a {
    font-size: 14px;
    white-space: nowrap;
  }
</style>
</head>
<body>

  <div class="swatch"></div>

  <nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="projects-main.html">Projects</a>
    <a href="about.html">About</a>
  </nav>

  <div class="list">

    <a class="project-tile" href="project/tesla.html">
      <div class="image"><img src="images/tesla.jpg" alt="Tesla Design Studio"></div>
      <div class="caption">
        <div class="title">Tesla Design Studio</div>
      </div>
    </a>

    <a class="project-tile" href="project/on-call-cafe.html">
      <div class="image"><img src="images/on-call-cafe.jpg" alt="On Call Cafe"></div>
      <div class="caption">
        <div class="title">On Call Cafe</div>
      </div>
    </a>

    <a class="project-tile" href="project/dschool.html">
      <div class="image"><img src="images/dschool-atrium.jpg" alt="d.school atrium with hanging kites and the make sign"></div>
      <div class="caption">
        <div class="title">d.school</div>
      </div>
    </a>

    <a class="project-tile" href="project/stanford-daily.html">
      <div class="image"><img src="images/journalism.jpg" alt="Hoover Tower and Main Quad arcades at Stanford"></div>
      <div class="caption">
        <div class="title">Journalism</div>
      </div>
    </a>

    <a class="project-tile" href="project/stanford-management.html">
      <div class="image fit"><img src="images/consumer-research.png" alt="Venn diagram of food, wellness, and beauty overlapping in lifestyle-driven design and innovation"></div>
      <div class="caption">
        <div class="title">Consumer Research</div>
      </div>
    </a>
  </div>

  <div class="footer">
    <div class="footer-inner">
      <div class="footer-left">
        <div class="loc">Los Angeles, CA</div>
        <div class="time" id="localTime">--:--</div>
      </div>
      <div class="footer-right">
        <div class="footer-col">
          <a href="index.html">Home</a>
          <a href="projects-main.html">Projects</a>
          <a href="about.html">About</a>
        </div>
        <div class="footer-col">
          <a href="https://www.linkedin.com/in/maiapak/" target="_blank" rel="noopener">LinkedIn</a>
        </div>
        <div class="footer-col">
          <a href="mailto:maiapak@stanford.edu">maiapak@stanford.edu</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateTime() {
      var el = document.getElementById('localTime');
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes().toString().padStart(2, '0');
      var s = now.getSeconds().toString().padStart(2, '0');
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12; if (h === 0) h = 12;
      el.textContent = h + ':' + m + ':' + s + ' ' + ampm;
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>


  <script>
    document.querySelectorAll('.nav-dropdown > a').forEach(function(trigger) {
      trigger.addEventListener('click', function(e) {
        var dropdown = trigger.parentElement;
        if (window.matchMedia('(hover: none)').matches) {
          if (!dropdown.classList.contains('open')) {
            e.preventDefault();
            document.querySelectorAll('.nav-dropdown.open').forEach(function(d) {
              if (d !== dropdown) d.classList.remove('open');
            });
            dropdown.classList.add('open');
          }
        }
      });
    });
    document.addEventListener('click', function(e) {
      document.querySelectorAll('.nav-dropdown.open').forEach(function(d) {
        if (!d.contains(e.target)) d.classList.remove('open');
      });
    });
  </script>
</body>
</html>
