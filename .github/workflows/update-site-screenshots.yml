# Retakes the website screenshots on the Consumer Research and Journalism pages every day
# (only saves one if that page changed). The list of sites is in scripts/update_site_screenshots.py.
# Can also be run by hand: GitHub repo > Actions > "Update website screenshots" > Run workflow.
name: Update website screenshots

on:
  schedule:
    - cron: "0 15 * * *"   # every day, 8am Pacific
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take screenshots
        run: |
          pip install playwright pillow
          python scripts/update_site_screenshots.py

      - name: Publish if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add images
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update website screenshots"
          git push
          # make sure GitHub Pages rebuilds with the new image
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
